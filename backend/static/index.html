<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Zeramai HR — Login</title>
<style>
  body{font-family:Arial,sans-serif;background:#f4f5f7;display:flex;height:100vh;align-items:center;justify-content:center;margin:0}
  .card{background:#fff;padding:32px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.1);width:320px}
  h2{margin-top:0;color:#1a1a2e}
  input{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}
  button{width:100%;padding:10px;background:#4338ca;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:15px}
  button:hover{background:#3730a3}
  #err{color:#c0392b;font-size:13px;min-height:18px}
</style>
</head>
<body>
<div class="card">
  <h2>Zeramai HR</h2>
  <input id="email" placeholder="Email" value="hr@zeramai.com">
  <input id="password" type="password" placeholder="Password" value="ChangeMe123!">
  <button onclick="login()">Login</button>
  <div id="err"></div>
</div>
<script>
async function login(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    credentials: 'include',
    body: JSON.stringify({email, password})
  });
  if(res.ok){ window.location.href = '/dashboard.html'; }
  else { document.getElementById('err').innerText = 'Login failed — check email/password.'; }
}
</script>
</body>
</html>
